[project]
name = "commerceops"
version = "0.2.0"
description = "Deterministic cross-border commerce engines, SOP citations, and approval-gated writebacks for OpenDot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "mcp>=2.3,<3",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32",
  "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2",
  "pytest>=8.3",
]

[project.scripts]
commerceops-api = "commerceops.api.app:main"
commerceops-mcp = "commerceops.mcp_server:main"
commerceops-seed = "commerceops.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["commerceops*"]

[tool.setuptools.package-data]
commerceops = ["sop/docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
